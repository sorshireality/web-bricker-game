<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout Game</title>
    <style>
        body {
            background: #111;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            touch-action: none;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            overflow: hidden;
            max-width: 100%;
            flex-direction: row;
        }

        #gameCanvas {
            background: #222;
            image-rendering: pixelated;
            max-width: 100%;
            height: auto;
        }

        .sidebar {
            width: 200px;
            background: #1a1a1a;
            color: #fff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 480px;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .score-display, .level-display {
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            text-align: center;
            flex: 1;
            margin: 0 5px;
        }

        .score-value, .level-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            margin: 5px 0;
        }

        .score-label, .level-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .start-button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .start-button:hover {
            background: #45a049;
        }

        .log-container {
            flex: 1;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
        }

        .log-title {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: center;
        }

        .log-messages {
            display: flex;
            flex-direction: column-reverse;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .log-message {
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 13px;
            transition: all 0.3s ease;
            word-break: break-word;
        }

        .log-message:nth-child(odd) {
            background: rgba(255, 255, 255, 0.08);
        }

        /* Custom scrollbar styling */
        .log-container::-webkit-scrollbar,
        .log-messages::-webkit-scrollbar {
            width: 6px;
        }

        .log-container::-webkit-scrollbar-track,
        .log-messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        .log-container::-webkit-scrollbar-thumb,
        .log-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .log-container::-webkit-scrollbar-thumb:hover,
        .log-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .game-container {
                flex-direction: column;
                width: 100%;
                height: 100vh;
            }

            #gameCanvas {
                width: 100%;
                height: auto;
                max-height: 70vh;
            }

            .sidebar {
                width: auto;
                height: auto;
                flex: 1;
            }

            .log-container {
                max-height: 20vh;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="480" height="480"></canvas>
    <div class="sidebar">
        <div class="game-info">
            <div class="score-display">
                <div class="score-label">SCORE</div>
                <div class="score-value" id="scoreValue">0</div>
            </div>
            <div class="level-display">
                <div class="level-label">LEVEL</div>
                <div class="level-value" id="levelValue">1</div>
            </div>
        </div>
        <div class="log-container">
            <div class="log-title">EVENT LOG</div>
            <div class="log-messages" id="logMessages">
                <!-- Log messages will be inserted here -->
            </div>
        </div>
    </div>
</div>
<script src="js/main.js" type="module"></script>
</body>
</html>
